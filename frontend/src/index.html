<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShopSphere | Curated Excellence</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'], 
            outfit: ['Outfit', 'sans-serif'],
          },
          animation: {
            'subtle-zoom': 'subtleZoom 20s infinite alternate',
            'float': 'float 6s ease-in-out infinite',
            'reveal': 'reveal 1.2s cubic-bezier(0.19, 1, 0.22, 1) both',
          },
          keyframes: {
            subtleZoom: {
              '0%': { transform: 'scale(1)' },
              '100%': { transform: 'scale(1.1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            reveal: {
              '0%': { opacity: '0', transform: 'translateY(40px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
            'luxury': '0 50px 100px rgba(0,0,0,0.1)',
          }
        }
      }
    }
  </script>
  <style>
    ::selection {
      background: #6366f1;
      color: white;
    }
    
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-[#0f172a] selection:bg-indigo-500 selection:text-white overflow-x-hidden">
  <app-root></app-root>
</body>
</html>
