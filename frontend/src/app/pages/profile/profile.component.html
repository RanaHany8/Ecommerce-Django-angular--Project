<div class="profile-wrapper">
  <div class="profile-card">
    <div class="avatar">{{ avatarLetter }}</div>
    <h2>My Profile ✨</h2>
    <p>Manage your account information</p>

    <div *ngIf="loading">Loading...</div>

    <form class="edit-form" *ngIf="!loading" (ngSubmit)="updateProfile()">
      <div class="input-group">
        <label>Username</label>
        <input [(ngModel)]="user.username" name="username" [readonly]="!editMode" />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input [(ngModel)]="user.email" name="email" [readonly]="!editMode" />
      </div>

      <div class="input-group">
        <label>Phone</label>
        <input [(ngModel)]="user.phone" name="phone" [readonly]="!editMode" />
      </div>

      <div class="input-group">
        <label>Address</label>
        <input [(ngModel)]="user.address" name="address" [readonly]="!editMode" />
      </div>

      <div class="actions">
        <button *ngIf="!editMode" type="button" (click)="startEdit()">Edit Profile</button>
        <button *ngIf="editMode" type="submit">Save Changes</button>
        <button *ngIf="editMode" type="button" class="cancel-btn" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>

    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <a routerLink="/" class="back">← Back to Home</a>
  </div>
</div>
