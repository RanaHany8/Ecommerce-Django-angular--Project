<div class="p-6 animate-reveal">
  <h2 class="text-2xl font-bold mb-6">User <span class="text-indigo-600">Management</span></h2>
  
  <div *ngIf="loading" class="text-center py-6 text-indigo-600 font-semibold">Loading users...</div>

  <div *ngIf="!loading" class="overflow-hidden rounded-2xl border border-white/20 shadow-glass bg-white/30 backdrop-blur-md">
    <table class="w-full text-left border-collapse">
      <thead class="bg-indigo-600/10 text-indigo-900">
        <tr>
          <th class="p-4 font-bold">Username</th>
          <th class="p-4 font-bold">Email</th>
          <th class="p-4 font-bold">Status</th>
          <th class="p-4 font-bold">Action</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr class="border-b border-slate-100 hover:bg-white/40 transition-all">
            <td class="p-4 text-slate-800 font-medium">{{ user.username }}</td>
            <td class="p-4 text-slate-600">{{ user.email }}</td>
            <td class="p-4">
              <span [class]="user.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="px-3 py-1 rounded-full text-xs font-bold">
                {{ user.is_active ? 'Active' : 'Banned' }}
              </span>
            </td>
            <td class="p-4">
              <button (click)="toggleStatus(user.id)" class="text-xs bg-slate-800 text-white px-3 py-1 rounded-lg hover:bg-indigo-600 transition-all">
                Change Status
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
